<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><title>Ludo</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--l0:#ffd9d6;--l1:#d3f4dc;--l2:#cfe4ff;--l3:#fff1b8}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--line:#38383a;--l0:#4a2523;--l1:#1f3d28;--l2:#1c3555;--l3:#4a4120}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr{display:none;max-width:520px;margin:0 auto;padding:14px}.scr.on{display:block}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 1px 3px #0001,0 8px 24px #0000000d}
h1{font-size:40px;margin:30px 0 4px;letter-spacing:-1px;text-align:center}.sub{text-align:center;color:var(--sub);margin:0 0 22px}
input{width:100%;border:0;border-radius:12px;background:var(--bg);color:var(--tx);padding:14px;font:inherit;outline:none}
input:focus{box-shadow:0 0 0 2px #007aff88}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:600 17px inherit;font-family:inherit;background:#007aff;color:#fff;margin-top:10px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.g{background:var(--bg);color:#007aff}.btn:disabled{opacity:.4}
.or{text-align:center;color:var(--sub);margin:16px 0 6px;font-size:14px}
#cd{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:700}
.big{font-size:46px;font-weight:800;letter-spacing:10px;text-align:center;margin:6px 0 14px}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--line)}.row:first-of-type{border:0}
.row i{width:16px;height:16px;border-radius:50%}.row span{color:var(--sub)}
#chips{display:flex;gap:6px;margin-bottom:8px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:12px;background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.55;transition:.2s}
.chip i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.on{opacity:1;box-shadow:0 0 0 2px var(--c),0 4px 12px #0002;transform:scale(1.04)}.chip.x{opacity:.25;text-decoration:line-through}
#bw{position:relative;width:min(100%,52dvh);margin:0 auto}
#board{display:grid;grid:repeat(15,1fr)/repeat(15,1fr);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 2px 6px #0002,0 14px 34px #0002;background:var(--card);position:relative}
#board i{display:grid;place-items:center;border:.5px solid var(--line);background:var(--card);font:normal clamp(7px,2.6vw,13px)/1 sans-serif;color:#8e8e9399}
#board i.y{background:var(--b);border-color:transparent}#board i.yi{background:var(--card);border-color:transparent}
.ctr{position:absolute;left:40%;top:40%;width:20%;height:20%;background:conic-gradient(from -45deg,#34c759 0 25%,#007aff 0 50%,#ffcc00 0 75%,#ff3b30 0)}
.tk{position:absolute;width:5.33%;height:5.33%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffa,#fff0 45%),var(--c);border:max(1.5px,.4vmin) solid #fff;box-shadow:0 2px 5px #0006;transition:left .14s ease-out,top .14s ease-out;z-index:2}
.tk.go{animation:hop .6s infinite;z-index:3;cursor:pointer}@keyframes hop{50%{transform:translateY(-25%) scale(1.15)}}
.fl{position:absolute;bottom:6%;text-align:center;pointer-events:none;animation:up 2s ease-out forwards;z-index:5}.fl b{font-size:40px;display:block}.fl small{background:#000a;color:#fff;border-radius:9px;padding:2px 7px;font-size:11px}
@keyframes up{to{transform:translateY(-220px);opacity:0}}
#ctl{display:flex;align-items:center;gap:14px;justify-content:center;margin:12px 0}
#dice{width:68px;height:68px;border-radius:18px;border:0;background:#fff;padding:11px;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);box-shadow:0 6px 16px #0003,0 0 0 3px var(--c,#aaa);transition:.2s}
#dice b{border-radius:50%;margin:1px}#dice b.on{background:#1c1c1e}#dice:disabled{opacity:.5}#dice.me{animation:pl 1.1s infinite}
@keyframes pl{50%{transform:scale(1.1)}}
#st{font-weight:600;min-width:150px}
#log{height:84px;overflow:auto;background:var(--card);border-radius:14px;padding:8px 12px;font-size:14px}#log p{margin:2px 0;word-break:break-word}
#em{display:flex;gap:4px;overflow:auto;margin:8px 0}#em button{border:0;background:var(--card);border-radius:12px;font-size:22px;padding:6px 10px}#em button:active{transform:scale(.85)}
#cf{display:flex;gap:8px}#cf .btn{width:auto;margin:0;padding:0 18px}
#win{position:fixed;inset:0;display:none;place-items:center;background:#0008;backdrop-filter:blur(10px);z-index:9}#win.on{display:grid}#win .card{text-align:center;width:min(86vw,340px)}#win h2{font-size:28px;margin:6px 0 4px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-80px);background:#000c;color:#fff;border-radius:20px;padding:10px 18px;font-size:14px;transition:.3s;z-index:20;backdrop-filter:blur(10px)}#toast.on{transform:translate(-50%,0)}
#mu{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);border:0;background:var(--card);border-radius:50%;width:36px;height:36px;font-size:16px;z-index:8;box-shadow:0 1px 4px #0003}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<button id="mu" aria-label="Sound">🔊</button><div id="toast"></div>

<div class="scr on" id="home"><h1>Ludo</h1><p class="sub">Play with friends, anywhere.</p>
<div class="card"><input id="nm" placeholder="Your name" maxlength="12" autocomplete="off">
<button class="btn" id="mk">Create room</button><div class="or">or join a friend's room</div>
<input id="cd" placeholder="CODE" maxlength="4" autocomplete="off"><button class="btn g" id="jn">Join room</button></div></div>

<div class="scr" id="lobby"><h1 style="margin-top:20px">Lobby</h1><p class="sub">Share the code or link with up to 3 friends</p>
<div class="card"><div class="big" id="code"></div><button class="btn g" id="inv" style="margin:0 0 10px">Invite friends</button><div id="seats"></div>
<button class="btn" id="go">Start game</button></div></div>

<div class="scr" id="game"><div id="chips"></div>
<div id="bw"><div id="board"></div></div>
<div id="ctl"><button id="dice" aria-label="Roll dice"></button><div id="st"></div></div>
<div id="log"></div><div id="em"></div>
<form id="cf"><input id="tx" placeholder="Message" maxlength="120" autocomplete="off"><button class="btn">Send</button></form></div>

<div id="win"><div class="card"><div style="font-size:60px">🏆</div><h2 id="wn"></h2><p class="sub" id="wm"></p><button class="btn" id="again">Play again</button></div></div>

<script>
const $=s=>document.querySelector(s),ST=[1,14,27,40],SAFE=[1,14,27,40,9,22,35,48],COL=['#ff3b30','#34c759','#007aff','#ffcc00'],EM=['😂','😍','😡','😭','👏','🔥','😎','🤯'];
const E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt()+';'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let S,me=-1,host=0,names=[],tk=[],gone=[],turn=-1,mv=[],rolled=0,els=[],mute=0,rt=0,t0=0;
// board geometry
const T=[],add=(r,c,dr,dc,n)=>{for(let i=0;i<n;i++)T.push([r+dr*i,c+dc*i])};
add(6,0,0,1,6);add(5,6,-1,0,6);add(0,7,0,1,2);add(1,8,1,0,5);add(6,9,0,1,6);add(7,14,1,0,2);add(8,13,0,-1,5);add(9,8,1,0,6);add(14,7,0,-1,2);add(13,6,-1,0,5);add(8,5,0,-1,6);T.push([7,0]);
const H=[[7,1,0,1],[1,7,1,0],[7,13,0,-1],[13,7,-1,0]].map(([r,c,dr,dc])=>Array.from({length:5},(_,i)=>[r+dr*i,c+dc*i]));
const Y=[[0,0],[0,9],[9,9],[9,0]],O=[[1,1],[1,4],[4,1],[4,4]],FIN=[[7,6.4],[6.4,7],[7,7.6],[7.6,7]];
const B=$('#board'),cells=[];
for(let i=0;i<225;i++){const d=document.createElement('i');cells.push(d);B.append(d)}
const cl=(r,c)=>cells[r*15+c];
Y.forEach(([r0,c0],s)=>{for(let r=0;r<6;r++)for(let c=0;c<6;c++){const e=cl(r0+r,c0+c);e.className=r&&c&&r<5&&c<5?'yi':'y';e.style.setProperty('--b',`var(--l${s})`)}});
H.forEach((h,s)=>h.forEach(([r,c])=>cl(r,c).style.background=`color-mix(in srgb,${COL[s]} 60%,var(--card))`));
SAFE.forEach(x=>{const[r,c]=T[x];cl(r,c).textContent='★'});
ST.forEach((x,s)=>{const[r,c]=T[x];cl(r,c).style.background=COL[s];cl(r,c).style.color='#fffc'});
B.insertAdjacentHTML('beforeend','<div class="ctr"></div>');
// sound
let AC;const au=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,d=.1,ty='sine',v=.15,f2,t0=0){if(mute)return;try{const a=au(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}catch{}}
const snd={tick:()=>tone(520,.07,'triangle',.18,780),roll:()=>{for(let i=0;i<6;i++)tone(170+Math.random()*130,.04,'square',.06,0,i*.07)},land:()=>tone(880,.15,'sine',.12,1320),cut:()=>tone(320,.3,'sawtooth',.12,60),home:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',.14,0,i*.09)),turn:()=>tone(660,.12,'sine',.1,990),pop:()=>tone(900,.05,'sine',.08)};
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊'};
addEventListener('pointerdown',()=>{try{au().resume()}catch{}});
// ui helpers
const show=id=>document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const face=n=>{$('#dice').innerHTML=Array.from({length:9},(_,i)=>`<b class="${PIPS[n].includes(i)?'on':''}"></b>`).join('')};face(0);
EM.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e;b.type='button';b.onclick=()=>send({t:'e',x:i});$('#em').append(b)});
function lobbyUI(){
  $('#seats').innerHTML=names.map((n,i)=>`<div class="row"><i style="background:${COL[i]}"></i>${n?E(n)+(i==me?' (you)':'')+(i==host?' 👑':''):'<span>Waiting…</span>'}</div>`).join('');
  const n=names.filter(Boolean).length,h=me==host;
  $('#go').style.display=h?'':'none';$('#go').disabled=n<2;$('#go').textContent=n<2?'Waiting for players…':'Start game';
}
function chips(){$('#chips').innerHTML=names.map((n,i)=>n?`<div class="chip ${i==turn?'on':''} ${gone[i]?'x':''}" style="--c:${COL[i]}"><i></i>${E(n)}</div>`:'').join('')}
function build(){
  els.flat().forEach(e=>e&&e.remove());els=[];
  tk.forEach((a,s)=>{if(!a)return;els[s]=[];for(let k=0;k<4;k++){const e=document.createElement('div');e.className='tk';e.style.setProperty('--c',COL[s]);e.onclick=()=>{if(s==me&&turn==me&&rolled&&mv.includes(k)){send({t:'m',k});mv=[];hl()}};B.append(e);els[s][k]=e}});
  lay();
}
function hl(){els.forEach((a,s)=>a&&a.forEach((e,k)=>e.classList.toggle('go',s==turn&&s==me&&mv.includes(k))))}
function lay(){
  const g={};
  tk.forEach((a,s)=>a&&a.forEach((p,k)=>{let r,c;
    if(p<0){r=Y[s][0]+O[k][0];c=Y[s][1]+O[k][1]}
    else if(p<=50)[r,c]=T[(ST[s]+p)%52];
    else if(p<56)[r,c]=H[s][p-51];
    else{r=FIN[s][0]+(s%2?0:(k-1.5)*.1);c=FIN[s][1]+(s%2?(k-1.5)*.1:0)}
    (g[r+','+c]=g[r+','+c]||[]).push([s,k,r,c])}));
  Object.values(g).forEach(a=>a.forEach(([s,k,r,c],i)=>{const e=els[s][k];e.style.left=(c+(i-(a.length-1)/2)*.2+.1)*100/15+'%';e.style.top=(r+.1)*100/15+'%';e.style.display=gone[s]?'none':''}));
}
function rattle(){t0=Date.now();snd.roll();clearInterval(rt);rt=setInterval(()=>face(1+Math.random()*6|0),80)}
// network
const send=o=>S&&S.readyState==1&&S.send(JSON.stringify(o));
const Q=[];let busy=0;
async function pump(){if(busy)return;busy=1;while(Q.length)await on(Q.shift());busy=0}
function go(c){
  const n=$('#nm').value.trim()||'Player';try{localStorage.n=n}catch{}
  if(c&&c.length!=4)return toast('Enter the 4-letter room code');
  if(S&&S.readyState==1)return send({t:'j',c,n});
  S=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  S.onopen=()=>send({t:'j',c,n});
  S.onmessage=e=>{const m=JSON.parse(e.data);if(m.t=='c'||m.t=='e')on(m);else{Q.push(m);pump()}};
  S.onclose=()=>{toast('Connection lost');show('home');S=0};
}
async function on(m){switch(m.t){
case'err':toast(m.m);break;
case'l':me=m.me;host=m.h;names=m.p;$('#code').textContent=m.c;history.replaceState(0,'','?r='+m.c);lobbyUI();show('lobby');break;
case'g':names=m.p;gone=[];tk=names.map(n=>n&&[-1,-1,-1,-1]);$('#win').classList.remove('on');build();show('game');turn=-1;await setTurn(m.s);break;
case't':await setTurn(m.s);break;
case'd':{if(!rt)rattle();await sleep(Math.max(0,520-(Date.now()-t0)));clearInterval(rt);rt=0;face(m.v);snd.land();mv=m.m;hl();
  $('#st').textContent=mv.length?(m.s==me?'Tap a glowing token':names[m.s]+' is choosing…'):'No move possible';
  if(m.s==me&&mv.length==1){await sleep(450);send({t:'m',k:mv[0]});mv=[];hl()}else await sleep(mv.length?0:700);break}
case'm':{const{s,k}=m;let p=tk[s][k];mv=[];hl();
  if(p<0){tk[s][k]=0;snd.tick();lay();await sleep(220)}else while(p<m.p){tk[s][k]=++p;snd.tick();lay();await sleep(150)}
  snd.land();
  if(m.c.length){await sleep(150);m.c.forEach(([o,j])=>tk[o][j]=-1);snd.cut();lay();toast(names[s]+' sent a token home!')}
  if(m.p==56)snd.home();
  await sleep(300);break}
case'q':gone[m.s]=1;host=m.h;lay();chips();toast(names[m.s]+' left the game');break;
case'x':{await sleep(300);snd.home();$('#wn').textContent=names[m.s]+(m.s==me?' (you) won!':' wins!');
  $('#wm').textContent=me==host?'Ready for another round?':'Waiting for the host to start again…';$('#again').style.display=me==host?'':'none';$('#win').classList.add('on');break}
case'c':{const p=document.createElement('p'),b=document.createElement('b');b.style.color=COL[m.s];b.textContent=(names[m.s]||'')+' ';p.append(b,m.x);const L=$('#log');L.append(p);while(L.children.length>40)L.firstChild.remove();L.scrollTop=1e9;if(m.s!=me)snd.pop();break}
case'e':{if(!EM[m.x])break;const d=document.createElement('div');d.className='fl';d.innerHTML=`<b>${EM[m.x]}</b><small>${E(names[m.s]||'')}</small>`;d.style.left=8+Math.random()*68+'%';$('#bw').append(d);snd.pop();setTimeout(()=>d.remove(),2000);break}
}}
async function setTurn(s){
  turn=s;mv=[];rolled=0;hl();chips();
  const d=$('#dice');d.style.setProperty('--c',COL[s]);d.disabled=s!=me;d.classList.toggle('me',s==me);
  $('#st').textContent=s==me?'Your turn — roll the dice':names[s]+"'s turn";
  if(s==me)snd.turn();
}
$('#dice').onclick=()=>{if(turn!=me||rolled)return;rolled=1;send({t:'r'});rattle();$('#dice').classList.remove('me')};
$('#mk').onclick=()=>go('');$('#jn').onclick=()=>go($('#cd').value.trim());
$('#go').onclick=()=>send({t:'s'});$('#again').onclick=()=>send({t:'s'});
$('#inv').onclick=()=>{const u=location.href,t='Join my Ludo game! Code: '+$('#code').textContent;navigator.share?navigator.share({title:'Ludo',text:t,url:u}).catch(()=>{}):navigator.clipboard.writeText(t+' '+u).then(()=>toast('Link copied'))};
$('#cf').onsubmit=e=>{e.preventDefault();const x=$('#tx').value.trim();if(x)send({t:'c',x});$('#tx').value=''};
try{$('#nm').value=localStorage.n||''}catch{}
const q=new URLSearchParams(location.search).get('r');if(q){$('#cd').value=q.slice(0,4).toUpperCase();$('#jn').classList.remove('g')}
</script></body></html>
